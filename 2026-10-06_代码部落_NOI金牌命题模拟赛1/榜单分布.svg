<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="white"/>
<text x="50" y="42" font-size="24" font-family="sans-serif">NOI金牌命题模拟赛1：实时榜单快照（口径校正版）</text>
<text x="50" y="70" font-size="14" font-family="sans-serif">54 = 当时榜单行数，不等于54个已完赛样本；大量0分账号尚未开始。</text>
<rect x="70" y="120" width="660" height="28" fill="#222"/><text x="745" y="140" font-size="14" font-family="sans-serif">220</text>
<rect x="70" y="165" width="630" height="28" fill="#444"/><text x="715" y="185" font-size="14" font-family="sans-serif">210</text>
<rect x="70" y="210" width="600" height="28" fill="#666"/><text x="685" y="230" font-size="14" font-family="sans-serif">200（本人，实时第3）</text>
<text x="70" y="285" font-size="18" font-family="sans-serif">可以确认：</text>
<text x="90" y="318" font-size="15" font-family="sans-serif">• 当时页面显示本人 200 分、3 / 54</text>
<text x="90" y="348" font-size="15" font-family="sans-serif">• 当时前两名 220 / 210</text>
<text x="90" y="378" font-size="15" font-family="sans-serif">• 榜单中存在尚未开始的0分账号</text>
<text x="540" y="285" font-size="18" font-family="sans-serif">不能从该快照推断：</text>
<text x="560" y="318" font-size="15" font-family="sans-serif">• 最终参赛人数 / 完赛人数</text>
<text x="560" y="348" font-size="15" font-family="sans-serif">• 全体平均分 / 中位数 / 0分率</text>
<text x="560" y="378" font-size="15" font-family="sans-serif">• 最终各题 AC 率 / 最终难度分布</text>
<line x1="50" y1="430" x2="950" y2="430" stroke="#333"/>
<text x="50" y="470" font-size="14" font-family="sans-serif">以后只有最终榜单或“已开始/已完赛”状态可确认时，才做全体分布统计。</text>
</svg>